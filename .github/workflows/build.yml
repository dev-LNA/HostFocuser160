name: Build with Spec File

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        # Define os sistemas operacionais para o build
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14.4'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libqt6gui6 # Dependências básicas para Qt6 no Ubuntu

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyqt6  # Altere para pyqt5 se for o caso
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller main.spec 

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.os }}
        path: |
          dist/*.exe
          dist/*
          !dist/*.spec # Exclui arquivos irrelevantes do upload